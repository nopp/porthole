apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: app
  labels:
    app: web
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
status:
  phase: Running
  podIP: 10.0.1.10
