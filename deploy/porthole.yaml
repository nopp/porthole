# Porthole.
# Read-only. Do not expose the Service outside the cluster: the API shows
# pod IPs, labels, and which flows the policies leave open.
apiVersion: v1
kind: Namespace
metadata:
  name: porthole
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: porthole
  namespace: porthole
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: porthole
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: porthole
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: porthole
subjects:
  - kind: ServiceAccount
    name: porthole
    namespace: porthole
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: porthole
  namespace: porthole
  labels:
    app: porthole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: porthole
  template:
    metadata:
      labels:
        app: porthole
    spec:
      serviceAccountName: porthole
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: porthole
          image: porthole:dev
          imagePullPolicy: IfNotPresent
          args: ["serve", "--addr", ":8080", "--refresh", "15s"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: porthole
  namespace: porthole
spec:
  selector:
    app: porthole
  ports:
    - name: http
      port: 8080
      targetPort: http
