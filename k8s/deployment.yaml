apiVersion: apps/v1
kind: Deployment
metadata:
  name: porthole
  namespace: porthole
  labels:
    app: porthole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: porthole
  template:
    metadata:
      labels:
        app: porthole
    spec:
      serviceAccountName: porthole
      containers:
      - name: porthole
        image: ghcr.io/nopp/porthole:0.0.2
        resources: {}
